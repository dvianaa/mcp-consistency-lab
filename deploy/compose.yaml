services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: durable_mcp
      POSTGRES_USER: durable_mcp
      POSTGRES_PASSWORD: durable_mcp
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U durable_mcp -d durable_mcp
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
